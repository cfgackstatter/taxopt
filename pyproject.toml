[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxopt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["yfinance", "pandas", "jupyter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
